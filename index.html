<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Murmur · a whiteboard that never falls apart</title>
    <meta name="description" content="Murmur is a real-time collaborative whiteboard with a hand-written CRDT sync engine. Draw together, offline or online, through lag, loss and dropped connections, and every copy ends up the same." />
    <meta property="og:title" content="Murmur" />
    <meta property="og:description" content="A real-time whiteboard with a hand-written CRDT sync engine. Break the network; the board holds." />
    <meta property="og:image" content="/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..700&family=Martian+Mono:wdth,wght@75..112.5,300..600&display=swap"
    />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("murmur.theme");
          if (t !== "dark" && t !== "light") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          document.documentElement.dataset.theme = t;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
